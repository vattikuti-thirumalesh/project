<!DOCTYPE html>
<html>
    <head>
        <title>Grid practice</title>

    </head>
    <body style="padding-bottom:1000px">
        
        <div style="
        margin-top:30px;
        display:grid;
        grid-template-columns: 100px 100px ;
        ">
        <div style="background-color:purple">div 1 <p>text</p></div>
        <div style="background-color:blue">div 2 </div>
</div>

    <div style="
    margin-top: 30px;
            display:grid;
            grid-template-columns: 100px 100px 200px;
            ">
            <div style="background-color:purple">div 1</div>
            <div style="background-color:blue">div 2 </div>
            <div style="background-color:pink"> <p>text</p>div 3 </div>
              <div style="background-color:blue">div 4 </div>
            </div>

    <div style="
    margin-top: 30px;
            display:grid;
            grid-template-columns: 100px 100px 1fr;
            ">
            <div style="background-color:purple">div 1</div>
            <div style="background-color:lightskyblue">div 2</div>
            <div style="background-color:pink">div 3 </div>
            </div>

    <div style="
    margin-top:30px;
            display:grid;
            grid-template-columns:100px 1fr 1fr;
            ">
            <div style="background-color:pink">pink</div>
            <div style="background-color:aqua">blue</div>
            <div style="background-color:purple">blue</div>
            </div>

     <div style="
    margin-top:30px;
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            column-gap:20px;
            row-gap:40px;
            ">
            <div style="background-color:pink; height:300px;">pink</div>
            <div style="background-color:aqua; height:300px;">blue</div>
            <div style="background-color:purple;
            height:300px;">1fr</div>
             <div style="background-color:purple; height:300px;">blue</div>
            <div style="background-color:green; height:300px;">blue</div>
            <div style="background-color:pink; height:300px;">blue</div>
            </div>

    </body>

</html>
